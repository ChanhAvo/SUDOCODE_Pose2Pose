[project]
name = "pose2pose-poc"
version = "0.1.0"
description = "Pose2Pose Proof of Concept - Streamlit Frontend + Python Backend Functions"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.3.4",
    "crewai>=0.193.2",
    "crewai-tools>=0.76.0",
    "google-api-python-client>=2.187.0",
    "google-auth>=2.43.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.2",
    "langchain>=1.0.7",
    # Frontend
    "langchain-chroma>=1.0.0",
    "langchain-core>=1.0.5",
    "langchain-openai>=1.0.3",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.50.0",
    # Backend (no API dependencies needed)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
]

[tool.uv.sources]

